name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  unit-tests:
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .NET
        run: dotnet --info

      - name: Restore unit tests
        run: |
          dotnet restore tests/Catchlogr.Tests/Catchlogr.Tests.csproj

      - name: Build unit tests
        run: |
          dotnet build tests/Catchlogr.Tests/Catchlogr.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Run unit tests
        run: |
          dotnet test tests/Catchlogr.Tests/Catchlogr.Tests.csproj \
            --configuration Release \
            --no-build

  integration-tests:
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .NET
        run: dotnet --info

      - name: Restore API integration tests
        run: dotnet restore tests/Catchlogr.Api.IntegrationTests/Catchlogr.Api.IntegrationTests.csproj

      - name: Build API integration tests
        run: |
          dotnet build tests/Catchlogr.Api.IntegrationTests/Catchlogr.Api.IntegrationTests.csproj \
            --configuration Release \
            --no-restore

      - name: Run API integration tests
        run: |
          dotnet test tests/Catchlogr.Api.IntegrationTests/Catchlogr.Api.IntegrationTests.csproj \
            --configuration Release \
            --no-build

  validate-main-source:
    if: github.base_ref == 'main'
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Ensure only dev can merge to main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only the dev branch may be merged into main."
            echo "Source branch was: ${{ github.head_ref }}"
            exit 1
          fi
