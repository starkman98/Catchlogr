name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  unit-tests:
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .NET
        run: dotnet --info

      - name: Restore unit tests
        run: |
          dotnet restore tests/Catchlogr.Tests/Catchlogr.Tests.csproj

      - name: Build unit tests
        run: |
          dotnet build tests/Catchlogr.Tests/Catchlogr.Tests.csproj \
            --configuration Release \
            --no-restore

      - name: Run unit tests
        run: |
          dotnet test tests/Catchlogr.Tests/Catchlogr.Tests.csproj \
            --configuration Release \
            --no-build

  integration-tests:
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify .NET
        run: dotnet --info

      - name: Restore API integration tests
        run: dotnet restore tests/Catchlogr.Api.IntegrationTests/Catchlogr.Api.IntegrationTests.csproj

      - name: Build API integration tests
        run: |
          dotnet build tests/Catchlogr.Api.IntegrationTests/Catchlogr.Api.IntegrationTests.csproj \
            --configuration Release \
            --no-restore

      - name: Run API integration tests
        run: |
          dotnet test tests/Catchlogr.Api.IntegrationTests/Catchlogr.Api.IntegrationTests.csproj \
            --configuration Release \
            --no-build

  mobile-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore mobile tests
        run: dotnet restore tests/Catchlogr.Mobile.Tests/Catchlogr.Mobile.Tests.csproj

      - name: Run mobile tests
        run: >
          dotnet test
          tests/Catchlogr.Mobile.Tests/Catchlogr.Mobile.Tests.csproj
          --configuration Release

  documentation:
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate documentation
        shell: pwsh
        run: ./scripts/validate-docs.ps1

  validate-main-source:
    if: github.base_ref == 'main'
    runs-on: [self-hosted, linux, x64, catchlogr]

    steps:
      - name: Ensure only dev can merge to main
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Only the dev branch may be merged into main."
            echo "Source branch was: ${{ github.head_ref }}"
            exit 1
          fi
